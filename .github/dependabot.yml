# Keeps the SHA-pinned GitHub Actions current (L-24): Dependabot opens a PR that updates both the SHA and the
# trailing `# vX.Y.Z` comment. Review the upstream release/diff before merging; a new SHA is new code that runs with
# the workflow's secrets. Use the "Dependabot" tab or `gh pr list --author app/dependabot` to find the PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
