# Release to the VPS (replaces the AWS pipeline, ADR 0007). Builds three images once, pushes them to GitHub
# Container Registry, copies deploy/ to the server, runs migrations, then restarts the services. Caddy holds
# requests during the restart (lb_try_duration), so a deploy does not drop requests (TR-NFR-07).
#
# Secrets (Settings → Environments → production → Environment secrets, so only the approved `vps` job sees them):
#   VPS_HOST, VPS_USER (deploy), VPS_SSH_KEY (private key), GHCR_READ_TOKEN (read:packages, used by the server to
#   pull images), and VPS_HOST_FINGERPRINT (M-21): the server's SSH host key fingerprint, `SHA256:` + 43 base64
#   characters. Get it OUT OF BAND, never by trusting a first network connection: on the provider's web console
#   (or the output of scripts/server-setup.sh) run
#       for k in /etc/ssh/ssh_host_*_key.pub; do ssh-keygen -lf "$k"; done
#   and copy the second field of the key type the actions negotiate. They use Go's SSH client, which prefers an
#   ECDSA host key over Ed25519 when the server has both, so on a stock Ubuntu/Debian server use the ECDSA line;
#   if a deploy fails with a fingerprint mismatch, use the Ed25519 line instead. A missing, malformed or wrong
#   fingerprint fails the job before anything is copied (fail closed). Update it whenever the server is rebuilt.
#
# Protect the `production` environment (L-26): Settings → Environments → production → Required reviewers (at least
# one person other than the one who starts the run), "Prevent self-review", and Deployment branches and tags →
# "Selected branches and tags" (main and release tags) so `workflow_dispatch` cannot release an arbitrary ref.
#
# Third-party actions are pinned to full commit SHAs (L-24); the trailing comment is the tag. .github/dependabot.yml
# proposes updates. Resolve a new tag with: git ls-remote https://github.com/<owner>/<repo> 'refs/tags/<tag>*'
# (use the ^{} line for annotated tags).
name: deploy
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or branch to release
        required: true
        default: main

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/tanbeeh

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR; only this job gets it
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ inputs.ref }}', persist-credentials: false }
      - id: tag
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: api image (api, realtime, worker, migrate)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: { context: backend, push: true, tags: '${{ env.REGISTRY }}/api:${{ steps.tag.outputs.tag }}' }
      - name: web image (Caddy + six apps)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: { context: ., file: deploy/web.Dockerfile, push: true, tags: '${{ env.REGISTRY }}/web:${{ steps.tag.outputs.tag }}' }
      - name: backup image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: { context: deploy/backup, push: true, tags: '${{ env.REGISTRY }}/backup:${{ steps.tag.outputs.tag }}' }

      # Image scans (TR-SEC-11). trivy-action v0.35.0 predates the March 2026 tag hijack (CVE-2026-33634) and installs
      # Trivy v0.69.3, both listed as safe by the vendor advisory; Trivy is pinned explicitly too.
      - name: Scan api image (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.69.3
          image-ref: '${{ env.REGISTRY }}/api:${{ steps.tag.outputs.tag }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
      # Everything else that runs on the server is scanned and reported, but does not block a release:
      #  - our web/backup images mostly inherit Caddy/MySQL base-image findings we can only fix by bumping the base;
      #  - the third-party images are what docker-compose.yml runs. The MinIO image is EXPECTED to report findings,
      #    including the H-3 write-bypass advisories that have no community fix (contained by the Caddyfile; see
      #    docs/runbooks/storage-migration.md). Read the table in the job log/summary on every release.
      # Keep this list in sync with the `image:` lines in deploy/docker-compose.yml.
      - name: Scan deployed images (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.69.3
          image-ref: '${{ env.REGISTRY }}/web:${{ steps.tag.outputs.tag }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
      - name: Scan backup, MinIO, mc, MySQL and Redis images (report only)
        env:
          IMAGES: >-
            ${{ env.REGISTRY }}/backup:${{ steps.tag.outputs.tag }}
            minio/minio:RELEASE.2025-04-22T22-12-26Z
            minio/mc:RELEASE.2025-04-16T18-13-26Z
            mysql:8.4
            redis:7-alpine
        run: |
          # trivy is on PATH from the previous step (setup-trivy).
          for img in $IMAGES; do
            echo "::group::trivy $img"
            trivy image --quiet --severity CRITICAL,HIGH --exit-code 0 --format table "$img" | tee -a trivy-report.txt
            echo "::endgroup::"
          done
          { echo '### Report-only image scan (CRITICAL,HIGH)'; echo '```'; cat trivy-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  vps:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production # required reviewers + allowed refs: see the header
    steps:
      - name: Preflight - host key fingerprint is configured (fail closed, M-21)
        env:
          FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          if ! printf '%s' "$FINGERPRINT" | grep -Eq '^SHA256:[A-Za-z0-9+/]{43}$'; then
            echo "::error::Secret VPS_HOST_FINGERPRINT is missing or not of the form SHA256:<43 base64 chars>. Get it out of band on the server console: ssh-keygen -lf /etc/ssh/ssh_host_ecdsa_key.pub (see the workflow header). Refusing to deploy without host verification."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ inputs.ref }}', persist-credentials: false }
      - name: Copy deploy files (never .env or secrets)
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          source: 'deploy/docker-compose.yml,deploy/Caddyfile,deploy/mysql,deploy/minio,deploy/backup/*.sh,deploy/backup/Dockerfile,deploy/scripts'
          target: /opt/tanbeeh
          strip_components: 1
      - name: Migrate and restart
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          script: |
            set -e
            cd /opt/tanbeeh
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            export REGISTRY=${{ env.REGISTRY }} IMAGE_TAG=${{ needs.images.outputs.tag }}
            # Fails here, before anything restarts, if .env lacks a required value (e.g. the M-11/L-27 keys).
            docker compose config --quiet
            docker compose pull --quiet
            docker compose run --rm migrate
            docker compose up -d --remove-orphans
            sleep 10
            docker compose ps
            curl -fsS --resolve "api.$(grep ^DOMAIN= .env | cut -d= -f2):443:127.0.0.1" "https://api.$(grep ^DOMAIN= .env | cut -d= -f2)/readyz"
